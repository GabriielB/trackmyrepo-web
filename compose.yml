name: trackmyrepo

services:
  db:
    image: postgres:17-alpine

    environment:
      POSTGRES_USER: trackmyrepo
      POSTGRES_PASSWORD: trackmyrepo
      POSTGRES_DB: trackmyrepo

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trackmyrepo -d trackmyrepo"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../trackmyrepo-api

    environment:
      DATABASE_URL: postgresql+psycopg://trackmyrepo:trackmyrepo@db:5432/trackmyrepo
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}

    ports:
      - "8000:8000"

    depends_on:
      db:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000

    ports:
      - "3000:3000"

    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
    name: trackmyrepo_pgdata
